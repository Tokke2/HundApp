<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 850" width="200mm" height="85mm">
  <defs>
    <style>
      .bg { fill: #FAF7F2; }
      .text-head { font-family: 'Fraunces', Georgia, serif; font-weight: bold; fill: #1B4332; }
      .text-sub { font-family: 'DM Sans', Helvetica, sans-serif; font-weight: 600; fill: #2D6A4F; }
      .meta { font-family: 'Courier New', monospace; font-size: 14px; fill: #6B7280; }
      .gold { fill: #F4D35E; }
      .pine { fill: #2D6A4F; }
      .deep-pine { fill: #1B4332; }
      .stroke-pine { stroke: #2D6A4F; stroke-width: 2; fill: none; }
      .cut-line { stroke: #FF00FF; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
      .safe-line { stroke: #10B981; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>

  <!-- MUG WRAP TEMPLATE (200 x 85 mm) -->
  <rect width="2000" height="850" class="bg"/>

  <!-- TRIM & BLEED GUIDES -->
  <rect x="20" y="20" width="1960" height="810" class="safe-line" opacity="0.5"/>
  <text x="30" y="45" class="meta">TRYCKOMRÅDE EMALJ- &amp; KERAMIKMUGG: 200 x 85 mm | SUB-FÄRGER: CMYK / PANTONE SOLID COATED</text>

  <!-- LEFT SIDE GRAPHIC (VÄNSTER SIDA - NÄR MAN HÅLLER MED HÖGER HAND) -->
  <g transform="translate(450, 420)">
    <!-- Circular Badge Frame -->
    <circle cx="0" cy="-30" r="140" fill="#E8F5E9" stroke="#2D6A4F" stroke-width="3"/>
    <circle cx="0" cy="-30" r="128" fill="none" stroke="#F4D35E" stroke-width="2" stroke-dasharray="8,6"/>
    
    <!-- Central Paw -->
    <path d="M-45,-10 C-60,-25 -40,-55 0,-55 C40,-55 60,-25 45,-10 C35,2 25,15 0,15 C-25,15 -35,2 -45,-10 Z" class="deep-pine"/>
    <ellipse cx="-60" cy="-70" rx="18" ry="25" transform="rotate(-25 -60 -70)" class="deep-pine"/>
    <ellipse cx="-20" cy="-100" rx="19" ry="27" transform="rotate(-10 -20 -100)" class="deep-pine"/>
    <ellipse cx="20" cy="-100" rx="19" ry="27" transform="rotate(10 20 -100)" class="deep-pine"/>
    <ellipse cx="60" cy="-70" rx="18" ry="25" transform="rotate(25 60 -70)" class="deep-pine"/>
    <!-- Gold Heart Center -->
    <circle cx="0" cy="-20" r="10" class="gold"/>

    <text x="0" y="155" text-anchor="middle" font-size="28" class="text-head">Morgonkaffe &amp; Skogspromenad</text>
    <text x="0" y="190" text-anchor="middle" font-size="16" class="text-sub" letter-spacing="4">HUNDAPP · UT PÅ TUR</text>
  </g>

  <!-- CENTER DIVIDER (UNDER ÖRAT / MOTSATT SIDA) -->
  <g transform="translate(1000, 420)">
    <!-- Vertical Pine Tree Icon Series -->
    <g transform="translate(0, -60)">
      <polygon points="0,-70 20,-30 -20,-30" class="deep-pine"/>
      <polygon points="0,-45 28,-5 -28,-5" class="deep-pine"/>
      <polygon points="0,-20 35,25 -35,25" class="deep-pine"/>
      <rect x="-6" y="25" width="12" height="20" fill="#8C5338"/>
    </g>
    <circle cx="0" cy="50" r="6" class="gold"/>
    <circle cx="0" cy="75" r="4" class="deep-pine"/>
    <circle cx="0" cy="95" r="3" class="gold"/>
    <text x="0" y="140" text-anchor="middle" font-size="14" class="meta" letter-spacing="3">100% HUNDKÄRLEK</text>
  </g>

  <!-- RIGHT SIDE GRAPHIC (HÖGER SIDA - NÄR MAN HÅLLER MED VÄNSTER HAND) -->
  <g transform="translate(1550, 420)">
    <!-- HundApp Typography and Slogan -->
    <g transform="translate(0, -80)">
      <!-- Paw silhouette -->
      <path d="M-30,0 C-40,-12 -25,-30 0,-30 C25,-30 40,-12 30,0 C22,8 15,18 0,18 C-15,18 -22,8 -30,0 Z" class="deep-pine"/>
      <ellipse cx="-40" cy="-38" rx="12" ry="16" transform="rotate(-20 -40 -38)" class="deep-pine"/>
      <ellipse cx="-14" cy="-56" rx="13" ry="18" class="deep-pine"/>
      <ellipse cx="14" cy="-56" rx="13" ry="18" class="deep-pine"/>
      <ellipse cx="40" cy="-38" rx="12" ry="16" transform="rotate(20 40 -38)" class="deep-pine"/>
    </g>
    
    <text x="0" y="30" text-anchor="middle" font-size="52" class="text-head" letter-spacing="2">HundApp</text>
    <text x="0" y="70" text-anchor="middle" font-size="18" class="text-sub" letter-spacing="6">FÖR VARJE TASSAVTRYCK</text>
    <line x1="-140" y1="95" x2="140" y2="95" stroke="#F4D35E" stroke-width="3"/>
    <text x="0" y="130" text-anchor="middle" font-size="15" class="meta">Hälsokoll · Rutiner · Äventyr</text>
  </g>

  <!-- PASSMÄRKEN I HÖRNER -->
  <line x1="0" y1="20" x2="20" y2="20" stroke="#000000" stroke-width="1"/>
  <line x1="20" y1="0" x2="20" y2="20" stroke="#000000" stroke-width="1"/>
  <line x1="1980" y1="0" x2="1980" y2="20" stroke="#000000" stroke-width="1"/>
  <line x1="1980" y1="20" x2="2000" y2="20" stroke="#000000" stroke-width="1"/>
</svg>
