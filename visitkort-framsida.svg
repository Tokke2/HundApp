<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="850" height="550" aria-label="HundApp Visitkort Framsida (85x55 mm)">
  <defs>
    <!-- Tryckfärger i Premium Skog/Smaragd Gradient -->
    <linearGradient id="bgFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c15" />
      <stop offset="40%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>

    <linearGradient id="shieldGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>

    <radialGradient id="glowTopRight" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#52b788" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#f4a261" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#f4a261" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Kortbakgrund (85x55 mm format) -->
  <rect width="850" height="550" fill="url(#bgFront)" rx="24" />

  <!-- Ljusreflektioner & Atmosfär -->
  <rect width="850" height="550" fill="url(#glowTopRight)" rx="24" />
  <rect width="850" height="550" fill="url(#glowBottomLeft)" rx="24" />

  <!-- Geometriska dekorlinjer & kurvor (Vektorelement för lyxig tryckkänsla) -->
  <path d="M 0 380 Q 250 280, 500 420 T 850 350 L 850 550 L 0 550 Z" fill="rgba(255, 255, 255, 0.03)" />
  <path d="M 0 450 Q 350 340, 650 500 T 850 480 L 850 550 L 0 550 Z" fill="rgba(82, 183, 136, 0.06)" />
  
  <!-- Subtila tryckmärken/ram -->
  <rect x="25" y="25" width="800" height="500" rx="16" fill="none" stroke="rgba(216, 243, 220, 0.12)" stroke-width="1.5" />

  <!-- Huvudsektion: Centrerad Stor Logotyp & Emblem -->
  <g transform="translate(425, 205)" text-anchor="middle" filter="url(#shadowHeavy)">
    <!-- Emblem Platta -->
    <g transform="translate(-50, -110)">
      <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#shieldGradFront)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
      
      <!-- Hjärtformad Trampdyna -->
      <path d="M 50 44 C 38 30, 24 40, 26 56 C 28 69, 44 80, 50 85 C 56 80, 72 69, 74 56 C 76 40, 62 30, 50 44 Z" fill="#ffffff" />
      <path d="M 50 56 C 46 50, 41 54, 42 60 C 44 65, 50 70, 50 70 C 50 70, 56 65, 58 60 C 59 54, 54 50, 50 56 Z" fill="url(#accentGold)" />

      <!-- 4 Tår -->
      <ellipse cx="28" cy="32" rx="7" ry="10" transform="rotate(-30 28 32)" fill="#ffffff" />
      <ellipse cx="43" cy="24" rx="8" ry="11" transform="rotate(-10 43 24)" fill="#ffffff" />
      <ellipse cx="57" cy="24" rx="8" ry="11" transform="rotate(10 57 24)" fill="#ffffff" />
      <ellipse cx="72" cy="32" rx="7" ry="10" transform="rotate(30 72 32)" fill="#ffffff" />
    </g>

    <!-- Logotyp Text -->
    <g transform="translate(0, 45)">
      <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" letter-spacing="-0.02em">
        <tspan fill="#ffffff" font-weight="600">Hund</tspan><tspan fill="#74c69d" font-weight="800">App</tspan>
      </text>
      <!-- Guldprick -->
      <circle cx="108" cy="-38" r="6" fill="url(#accentGold)" />
    </g>

    <!-- Slogan / Värdeerbjudande -->
    <text y="90" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#d8f3dc" letter-spacing="0.04em">
      Det smarta verktyget för ett tryggt och aktivt hundliv
    </text>
  </g>

  <!-- Nedre sektion: URL-bricka & Trygghetsbadge -->
  <g transform="translate(425, 460)" text-anchor="middle">
    <!-- URL Pill -->
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text y="6" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.08em">
      hundapp.se
    </text>
  </g>
</svg>