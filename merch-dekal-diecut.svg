<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="90mm" height="90mm">
  <defs>
    <style>
      .bg-bleed { fill: #1B4332; }
      .cut-contour { stroke: #FF00FF; stroke-width: 2; fill: none; }
      .safe-margin { stroke: #00FFFF; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
      .white-text { font-family: 'Fraunces', Georgia, serif; font-weight: bold; fill: #FFFFFF; }
      .gold-text { font-family: 'DM Sans', sans-serif; font-weight: 700; fill: #F4D35E; }
      .paw-pad { fill: #FFFFFF; }
      .paw-gold { fill: #F4D35E; }
      .meta-tag { font-family: 'Courier New', monospace; font-size: 11px; fill: #6B7280; }
    </style>
  </defs>

  <!-- 1. BLEED LAYER (UTFALL 2.5 mm UTANFÖR SKÄRLINJE) -->
  <circle cx="450" cy="450" r="425" class="bg-bleed"/>

  <!-- 2. GRAPHIC CONTENT LAYER -->
  <!-- Outer Gold Ring -->
  <circle cx="450" cy="450" r="375" fill="none" stroke="#F4D35E" stroke-width="4"/>
  <circle cx="450" cy="450" r="360" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Circular Text Path: HUNDAPP • SVERIGES BÄSTA HUNDVÄN -->
  <g transform="translate(450, 450)">
    
    <!-- Top Arc Text -->
    <path id="topTextArc" d="M -290,0 A 290,290 0 0,1 290,0" fill="none"/>
    <text font-size="28" font-family="'DM Sans', sans-serif" font-weight="800" fill="#F4D35E" letter-spacing="6">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        🐾 HUNDAPP • SVERIGE 🐾
      </textPath>
    </path>

    <!-- Bottom Arc Text -->
    <path id="bottomTextArc" d="M -290,0 A 290,290 0 0,0 290,0" fill="none"/>
    <text font-size="22" font-family="'DM Sans', sans-serif" font-weight="700" fill="#d8f3dc" letter-spacing="5">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        FÖR VARJE TASSAVTRYCK
      </textPath>
    </path>

    <!-- Central Dog Paw with Gold Crown/Heart -->
    <!-- Center Pad -->
    <path d="M-65,20 C-90,-5 -60,-50 0,-50 C60,-50 90,-5 -65,20 C45,40 30,60 0,60 C-30,60 -45,40 -65,20 Z" class="paw-pad"/>
    <!-- 4 Toes -->
    <ellipse cx="-80" cy="-65" rx="26" ry="36" transform="rotate(-25 -80 -65)" class="paw-pad"/>
    <ellipse cx="-28" cy="-105" rx="27" ry="38" transform="rotate(-10 -28 -105)" class="paw-pad"/>
    <ellipse cx="28" cy="-105" rx="27" ry="38" transform="rotate(10 28 -105)" class="paw-pad"/>
    <ellipse cx="80" cy="-65" rx="26" ry="36" transform="rotate(25 80 -65)" class="paw-pad"/>

    <!-- Gold Heart Stamp in paw -->
    <g transform="translate(0, 0) scale(1.1)">
      <path d="M 0,-15 C -15,-30 -30,-15 -30,0 C -30,15 0,35 0,35 C 0,35 30,15 30,0 C 30,-15 15,-30 0,-15 Z" class="paw-gold"/>
    </g>

    <!-- Small Pine Trees under paw -->
    <g transform="translate(0, 140)">
      <polygon points="0,-35 20,0 -20,0" fill="#F4D35E"/>
      <polygon points="-35,-20 -20,10 -50,10" fill="#ffffff" opacity="0.8"/>
      <polygon points="35,-20 50,10 20,10" fill="#ffffff" opacity="0.8"/>
      <circle cx="-90" cy="0" r="4" fill="#F4D35E"/>
      <circle cx="90" cy="0" r="4" fill="#F4D35E"/>
    </g>
  </g>

  <!-- 3. SAFE PRINT ZONE MARGIN (BLÅ STRECKAD LINJE) -->
  <circle cx="450" cy="450" r="380" class="safe-margin"/>

  <!-- 4. STANSLINJE / SKÄRLINJE (100% MAGENTA CUT CONTOUR) -->
  <circle cx="450" cy="450" r="400" class="cut-contour"/>

  <!-- TECHNICAL PRINT LABELS -->
  <text x="50" y="865" class="meta-tag">STANSLINJE (CUTCONTOUR): 80 mm DIAMETER | VINYL: MATT UV-LACKERAD | VATTENTÅLIG</text>
  <text x="50" y="885" class="meta-tag">MAGENTA = SKÄRLINJE | BLÅ STRECKAD = SÄKERHETSZON | UTFALL = 2.5 mm</text>
</svg>
