<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" aria-label="HundApp Logotyp">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="50%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <linearGradient id="pawAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#74c69d" />
    </linearGradient>
    <linearGradient id="heartGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b4332" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Bakgrundsplatta (transparent / vit) -->
  <rect width="100%" height="100%" fill="transparent" rx="16" />

  <!-- Logomärke / Emblem (Vänster) -->
  <g transform="translate(40, 20)" filter="url(#softShadow)">
    <!-- Yttre sköld med mjuka hörn -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#logoGrad)" />
    
    <!-- Hundsilhuett & Tass-symbol i vektorkurvor -->
    <!-- Huvuddyna / Hjärtformad trampdyna -->
    <path d="M 70 62 
             C 55 42, 35 55, 38 78 
             C 40 96, 62 112, 70 118 
             C 78 112, 100 96, 102 78 
             C 105 55, 85 42, 70 62 Z" 
          fill="#ffffff" />
    
    <!-- Valpnos / hjärtaccent i mitten -->
    <path d="M 70 78 
             C 65 70, 58 75, 60 84 
             C 62 91, 70 98, 70 98 
             C 70 98, 78 91, 80 84 
             C 82 75, 75 70, 70 78 Z" 
          fill="url(#heartGold)" />

    <!-- 4 Tådynor (Övre tassar) -->
    <!-- Tå 1 (Vänster ytter) -->
    <ellipse cx="40" cy="46" rx="10" ry="14" transform="rotate(-30 40 46)" fill="#ffffff" />
    <!-- Tå 2 (Vänster mitten) -->
    <ellipse cx="60" cy="34" rx="11" ry="15" transform="rotate(-10 60 34)" fill="#ffffff" />
    <!-- Tå 3 (Höger mitten) -->
    <ellipse cx="80" cy="34" rx="11" ry="15" transform="rotate(10 80 34)" fill="#ffffff" />
    <!-- Tå 4 (Höger ytter) -->
    <ellipse cx="100" cy="46" rx="10" ry="14" transform="rotate(30 100 46)" fill="#ffffff" />

    <!-- Glansreflex på skölden -->
    <path d="M 12 28 C 30 12, 60 8, 90 12 C 40 20, 20 45, 14 75 Z" fill="rgba(255,255,255,0.22)" />
  </g>

  <!-- Typografi (Höger) -->
  <g transform="translate(205, 95)">
    <!-- "Hund" i stilren, skandinavisk sans-serif -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="600" fill="#1b4332" letter-spacing="-0.02em">Hund</text>
    
    <!-- "App" i kraftig bold med accentfärg -->
    <text x="165" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#2d6a4f" letter-spacing="-0.02em">App</text>
    
    <!-- Accentprick (Guld/Koppar tass-accent på App) -->
    <circle cx="295" cy="-44" r="7.5" fill="url(#heartGold)" />
    
    <!-- Tagline: "TRYGGT & AKTIVT HUNDLIV" -->
    <text x="4" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#52b788" letter-spacing="0.22em" text-transform="uppercase">Tryggt &amp; Aktivt Hundliv</text>
    
    <!-- Subtil dekorativ linje -->
    <line x1="4" y1="46" x2="330" y2="46" stroke="#d8f3dc" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>